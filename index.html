<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Seperator</title>
    <style>
      .copyable {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .spacer {
        width: 30px;
      }
      .item-row {
        height: 24px;
        display: flex;
        align-items: center;
      }
      .clickable {
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 400px;
        font-family: monospace;
        background-color: #f9f9f9;
        padding: 0 4px;
      }
      .clickable:hover {
        background-color: #e0e0e0;
      }
      .copied {
        text-decoration: line-through;
        color: gray;
        background-color: transparent;
      }
      .metadata {
        margin-top: 10px;
        font-size: 0.9em;
        color: #555;
      }
      input[type="text"] {
        width: 300px;
      }
      .header-area {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 32px; /* 버튼 높이 고려 */
      }
      h3,
      p {
        margin: 2px 0;
      }
      .list-container {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      /* Select All 체크박스 라벨 스타일 */
      .select-all-label {
        font-size: 0.8em;
        display: flex;
        align-items: center;
        gap: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Presigned Key/Url seperator</h1>
    <h3>Raw JSON response</h3>
    <p>S3 Presigned Url, key, filename이 포함된 JSON 응답</p>

    <input
      type="text"
      id="jsonInput"
      placeholder='{"success": true, "data": {"urls": [...]}}'
    />
    <button id="convertBtn">Convert</button>
    <button id="resetBtn">Reset</button>

    <div class="metadata">
      <span class="length" id="dataLength">Data length: 0</span>
    </div>

    <br />
    <div class="copyable">
      <div class="column">
        <h3>URLs</h3>
        <div class="header-area">
          <p>click to copy</p>
        </div>
        <div id="urlList" class="list-container"></div>
      </div>

      <div class="spacer"></div>

      <div class="column">
        <h3>Select</h3>
        <div class="header-area">
          <label class="select-all-label">
            <input type="checkbox" id="selectAllKeys" /> All
          </label>
        </div>
        <div id="keyCbList" class="list-container"></div>
      </div>

      <div class="column">
        <h3>Keys</h3>
        <div class="header-area">
          <p>click to copy</p>
          <button id="copySelectedKeyBtn" style="display: none">
            Copy Selected
          </button>
        </div>
        <div id="keyList" class="list-container"></div>
      </div>
    </div>

    <script>
      const convertBtn = document.getElementById("convertBtn");
      const resetBtn = document.getElementById("resetBtn");
      const jsonInput = document.getElementById("jsonInput");
      const dataLengthDisplay = document.getElementById("dataLength");

      const urlList = document.getElementById("urlList");
      const keyCbList = document.getElementById("keyCbList");
      const keyList = document.getElementById("keyList");

      const selectAllKeys = document.getElementById("selectAllKeys");
      const copySelectedKeyBtn = document.getElementById("copySelectedKeyBtn");

      let currentKeys = [];

      convertBtn.addEventListener("click", () => {
        const inputValue = jsonInput.value.trim();
        if (!inputValue) {
          alert("JSON 데이터를 입력해주세요.");
          return;
        }

        try {
          const parsed = JSON.parse(inputValue);
          if (
            !parsed.success ||
            !parsed.data ||
            !Array.isArray(parsed.data.urls)
          ) {
            alert("올바른 형식의 데이터가 아닙니다.");
            return;
          }

          const items = parsed.data.urls;
          currentKeys = items.map((i) => i.key);

          clearOutputs();

          dataLengthDisplay.textContent = `Data length: ${items.length}`;
          copySelectedKeyBtn.style.display = "inline-block";

          items.forEach((item, index) => {
            // URL 추가
            const urlDiv = document.createElement("div");
            urlDiv.className = "item-row clickable";
            urlDiv.textContent = item.presignedUrl;
            urlDiv.title = item.presignedUrl;
            urlDiv.onclick = () => {
              navigator.clipboard
                .writeText(item.presignedUrl)
                .then(() => urlDiv.classList.add("copied"));
            };
            urlList.appendChild(urlDiv);

            // Key 체크박스 추가
            const cbContainer = document.createElement("div");
            cbContainer.className = "item-row";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.className = "key-checkbox";
            cb.dataset.index = index;
            cbContainer.appendChild(cb);
            keyCbList.appendChild(cbContainer);

            // Key 추가
            const keyDiv = document.createElement("div");
            keyDiv.className = "item-row clickable";
            keyDiv.textContent = item.key;
            keyDiv.title = item.key;
            keyDiv.onclick = () => {
              navigator.clipboard
                .writeText(item.key)
                .then(() => keyDiv.classList.add("copied"));
            };
            keyList.appendChild(keyDiv);
          });
        } catch (e) {
          alert("JSON 파싱 오류가 발생했습니다.");
        }
      });

      // Select All 기능
      selectAllKeys.addEventListener("change", (e) => {
        const isChecked = e.target.checked;
        const checkboxes = document.querySelectorAll(".key-checkbox");
        checkboxes.forEach((cb) => (cb.checked = isChecked));
      });

      // 일괄 복사 기능
      copySelectedKeyBtn.onclick = () => {
        const checkboxes = document.querySelectorAll(".key-checkbox:checked");
        if (checkboxes.length === 0) {
          alert("선택된 Key가 없습니다.");
          return;
        }

        const selectedValues = Array.from(checkboxes).map((cb) => {
          return `"${currentKeys[cb.dataset.index]}"`;
        });

        const resultText = selectedValues.join(",\n");
        navigator.clipboard.writeText(resultText).then(() => {
          alert(`${checkboxes.length}개의 Key가 복사되었습니다.`);
        });
      };

      resetBtn.addEventListener("click", () => {
        jsonInput.value = "";
        clearOutputs();
        dataLengthDisplay.textContent = "Data length: 0";
        currentKeys = [];
      });

      function clearOutputs() {
        urlList.innerHTML = "";
        keyCbList.innerHTML = "";
        keyList.innerHTML = "";
        selectAllKeys.checked = false;
        copySelectedKeyBtn.style.display = "none";
      }
    </script>
  </body>
</html>
